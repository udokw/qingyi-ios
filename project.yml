name: QingYi
options:
  bundleIdPrefix: com.qingyi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.7"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  # Pikafish 中国象棋引擎 (GPLv3), 静态链接进 App 进程内运行.
  # iOS 禁止 fork/exec 子进程, 因此不能按桌面方式走独立可执行文件 + 管道.
  Pikafish:
    type: library.static
    platform: iOS
    sources:
      - path: QingYi/Engines/Pikafish/src
        excludes:
          - "main.cpp"
          - "universal/**"
          - "**/*.S"
          - "external/decompress/huf_decompress_amd64.S"
          - "Makefile"
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_PREPROCESSOR_DEFINITIONS:
          - IS_64BIT=1
          - NDEBUG=1
          - USE_NEON=1
          - ZSTD_DISABLE_ASM=1
        SKIP_INSTALL: "YES"
        PRODUCT_NAME: Pikafish

  # KataGo 围棋引擎 (MIT), Eigen CPU 后端, 同样静态链接进 App.
  KataGo:
    type: library.static
    platform: iOS
    sources:
      - path: QingYi/Engines/KataGo/cpp
        excludes:
          - "main.cpp"
          - "tests/**"
          - "command/misc.cpp"
          - "neuralnet/cuda*"
          - "neuralnet/metal*"
          - "neuralnet/onnx*"
          - "neuralnet/opencl*"
          - "neuralnet/rocm*"
          - "neuralnet/trt*"
          - "neuralnet/dummybackend.cpp"
          - "neuralnet/*.cu"
      - path: QingYi/Engines/KataGoBridge.cpp
      - path: QingYi/Engines/KataGoBridge.h
      - path: QingYi/Engines/KataGo/cpp/tests/testcommon.cpp
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - USE_EIGEN_BACKEND=1
          - NDEBUG=1
          - NO_GIT_REVISION=1
          - NO_LIBZIP=1
          - BYTE_ORDER=1234
          - LITTLE_ENDIAN=1234
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/QingYi/Engines/KataGo/cpp"
          - "$(SRCROOT)/QingYi/Engines/KataGo/external/eigen"
          - "$(SRCROOT)/QingYi/Engines/KataGo/cpp/external/tclap-1.2.5/include"
          - "$(SRCROOT)/QingYi/Engines/KataGo/cpp/external/filesystem-1.5.8/include"
        SKIP_INSTALL: "YES"
        PRODUCT_NAME: KataGo

  # Pachi 围棋引擎 (GPLv2), 纯 C, 作为 1-6 级的人机引擎.
  Pachi:
    type: library.static
    platform: iOS
    sources:
      - path: QingYi/Engines/Pachi/src
        excludes:
          - "COPYING"
      - path: QingYi/Engines/PachiBridge.cpp
      - path: QingYi/Engines/PachiBridge.h
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_PREPROCESSOR_DEFINITIONS:
          - NDEBUG=1
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/QingYi/Engines/Pachi/src"
        SKIP_INSTALL: "YES"
        PRODUCT_NAME: Pachi

  QingYi:
    type: application
    platform: iOS
    sources:
      - path: QingYi
        excludes:
          - "Resources/**"
          - "Engines/Pikafish/**"
          - "Engines/KataGo/**"
          - "Engines/KataGoBridge.cpp"
          - "Engines/Pachi/**"
          - "Engines/PachiBridge.cpp"
      - path: QingYi/Resources
        buildPhase: resources
    dependencies:
      - target: Pikafish
      - target: KataGo
      - target: Pachi
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: QingYi/Engines/QingYi-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        # bridge.cpp 直接 include 引擎头文件, 宏必须与 Pikafish target 完全一致
        GCC_PREPROCESSOR_DEFINITIONS:
          - IS_64BIT=1
          - NDEBUG=1
          - USE_NEON=1
          - ZSTD_DISABLE_ASM=1
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/QingYi/Engines/Pikafish/src"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lz"
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyi.app
        PRODUCT_NAME: QingYi
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "清弈"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"

schemes:
  QingYi:
    build:
      targets:
        QingYi: all
    run:
      config: Debug
    archive:
      config: Release
