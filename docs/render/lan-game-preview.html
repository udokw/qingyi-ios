<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清弈 · 联机对局页渲染稿（对齐效果图）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 47px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 22px 6px 24px; font-size: 12px; font-weight: 600;
  }
  .homebar { height: 34px; display: flex; align-items: center; justify-content: center; }
  .homebar i { width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.28); }
  .page { flex: 1; display: flex; flex-direction: column; padding: 4px 0 0 0; }
  .hair { height: 0.8px; }
  .head { display: flex; align-items: flex-end; gap: 8px; padding: 2px 6px 0 6px; }
  .headL { font-family: "Songti SC","SimSun",serif; font-size: 17px; font-weight: 500; line-height: 22px; }
  .headC { text-align: center; }
  .headC .t { font-family: "Songti SC","SimSun",serif; font-size: 16px; font-weight: 700; line-height: 21px; }
  .headC .s { font-size: 11px; line-height: 14px; margin-top: 2px; }
  .headR { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .seal { width: 18px; height: 18px; color: #fff; font-size: 9px; font-weight: 600;
          display: flex; align-items: center; justify-content: center; }
  .status { font-size: 15px; line-height: 20px; white-space: nowrap; }
  .rule { font-size: 12px; line-height: 16px; text-align: center; padding: 10px 6px 0 6px; }
  .clock { display: flex; height: 34px; margin: 6px 6px 4px 6px; align-items: center; }
  .clock div.c { flex: 1; text-align: center; font-size: 18px; line-height: 22px; }
  .clock .v { width: 0.8px; height: 28px; }
  .board { margin: 4px 6px 0 6px; aspect-ratio: 1 / 1; position: relative; }
  .stateline { font-size: 12px; line-height: 16px; text-align: center; padding: 8px 8px 0 8px; }
  .spacer { flex: 1; min-height: 8px; }
  .cell { flex: 1; text-align: center; padding: 7px 0; }
  .cell .zh { font-size: 15px; line-height: 20px; }
  .cell .en { font-size: 9px; line-height: 12px; letter-spacing: .8px; margin-top: 2px; }
  .row { display: flex; }
  .vline { width: 0.8px; }
  .foot { font-size: 11px; letter-spacing: 2.6px; text-align: center; padding: 8px 0 6px 0; }
</style>
</head>
<body>
<div class="statusbar"><span>9:41</span><span>5G&nbsp;&nbsp;▮</span></div>
<div class="page" id="page"></div>
<div class="homebar"><i></i></div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("theme") === "monument" ? "monument" : "hara";
const game = params.get("game") === "xiangqi" ? "xiangqi" : "go";

const T = id === "hara" ? {
  windowBg: "#F7F4ED", title: "#1A1A1A", sub: "#6B665C", foot: "#9A9384", accent: "#C73E2B",
  divider: "#DDD6C4", boardBg: "#E3B771", boardLine: "#3A3226",
  sealRadius: "2px", boardRadius: "0px"
} : {
  windowBg: "#F6F1EA", title: "#3E3A36", sub: "#9A9186", foot: "#B0A79B", accent: "#E8846B",
  divider: "#E2D6C6", boardBg: "#F3E7CE", boardLine: "#A08B6D",
  sealRadius: "5px", boardRadius: "10px"
};
document.body.style.background = T.windowBg;
document.body.style.color = T.title;
document.querySelector(".statusbar").style.color = T.title;

const serif = '"Songti SC","SimSun","STSong",serif';
const page = document.getElementById("page");

/* ---------- 三列页头 ---------- */
const head = document.createElement("div");
head.className = "head";
head.innerHTML = `
  <div class="headL">我执白</div>
  <div style="flex:1;min-width:4px"></div>
  <div class="headC">
    <div class="t">${game === "go" ? "围棋" : "象棋"} · 房号 4821</div>
    <div class="s" style="color:${T.sub}">我执白 · 对手 棋友Ａ</div>
  </div>
  <div style="flex:1;min-width:4px"></div>
  <div class="headR">
    <div class="seal" style="background:${T.accent};border-radius:${T.sealRadius}">联</div>
    <div class="status">等待对手落子</div>
  </div>
`;
page.appendChild(head);

/* ---------- 规则行 ---------- */
const rule = document.createElement("div");
rule.className = "rule";
rule.style.color = T.sub;
rule.textContent = game === "go"
  ? "19 路 · 中国规则 · 贴 7.5 目 · 计时"
  : "9 × 10 · 中国象棋 · 计时";
page.appendChild(rule);

/* ---------- 发丝线 ---------- */
const h1 = document.createElement("div");
h1.className = "hair";
h1.style.cssText += `background:${T.divider};margin-top:8px`;
page.appendChild(h1);

/* ---------- 时钟 ---------- */
const clock = document.createElement("div");
clock.className = "clock";
clock.innerHTML = `
  <div class="c" style="color:${T.accent};font-weight:600">黑 19:27</div>
  <div class="v" style="background:${T.divider}"></div>
  <div class="c" style="color:${T.sub}">白 20:00</div>
`;
page.appendChild(clock);

/* ---------- 棋盘 ---------- */
const board = document.createElement("div");
board.className = "board";
board.style.background = T.boardBg;
board.style.borderRadius = T.boardRadius;
board.style.overflow = "hidden";
const N = 19;
const starIndex = [3, 9, 15];
let lines = "";
const pct = i => (4.2 + (i / (N - 1)) * 91.6) + "%";
for (let i = 0; i < N; i++) {
  const w = (i === 0 || i === N - 1) ? 1.6 : 0.75;
  lines += `<div style="position:absolute;left:4.2%;right:4.2%;top:${pct(i)};height:${w}px;background:${T.boardLine}"></div>`;
  lines += `<div style="position:absolute;top:4.2%;bottom:4.2%;left:${pct(i)};width:${w}px;background:${T.boardLine}"></div>`;
}
for (const sx of starIndex) for (const sy of starIndex) {
  lines += `<div style="position:absolute;left:${pct(sx)};top:${pct(sy)};width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:${T.boardLine}"></div>`;
}
board.innerHTML = lines;
page.appendChild(board);

/* ---------- 棋盘下一行状态 ---------- */
const state = document.createElement("div");
state.className = "stateline";
state.style.color = T.sub;
state.textContent = game === "go" ? "开局 · 黑先" : "开局 · 红先";
page.appendChild(state);

const sp = document.createElement("div");
sp.className = "spacer";
page.appendChild(sp);

/* ---------- 通栏动作区 ---------- */
const items = game === "go"
  ? [["悔棋", "UNDO", ""], ["停一手", "PASS", ""], ["认输", "RESIGN", T.accent],
     ["数子", "COUNT", ""], ["存谱", "SAVE SGF", ""], ["离开", "LEAVE", ""]]
  : [["悔棋", "UNDO", ""], ["认输", "RESIGN", T.accent], ["离开", "LEAVE", ""]];

const controls = document.createElement("div");
let grid = `<div class="hair" style="background:${T.divider}"></div>`;
for (let i = 0; i < items.length; i += 3) {
  grid += `<div class="row" style="height:auto">`;
  items.slice(i, i + 3).forEach((it, idx) => {
    if (idx > 0) grid += `<div class="vline" style="background:${T.divider}"></div>`;
    grid += `<div class="cell">
      <div class="zh" style="color:${it[2] || T.title}">${it[0]}</div>
      <div class="en" style="color:${T.sub}">${it[1]}</div>
    </div>`;
  });
  grid += `</div><div class="hair" style="background:${T.divider}"></div>`;
}
controls.innerHTML = grid;
page.appendChild(controls);

/* ---------- 页脚 ---------- */
const foot = document.createElement("div");
foot.className = "foot";
foot.style.color = T.foot;
foot.textContent = "局 域 网 · 清 弈";
page.appendChild(foot);
</script>
</body>
</html>
